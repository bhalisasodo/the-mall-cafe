<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bevel" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="30%" stop-color="#D6D6D6"/>
      <stop offset="65%" stop-color="#949494"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </radialGradient>
    <radialGradient id="teal" cx="36%" cy="26%" r="90%">
      <stop offset="0%" stop-color="#5FD2CD"/>
      <stop offset="45%" stop-color="#1FA6A2"/>
      <stop offset="100%" stop-color="#0B6E6B"/>
    </radialGradient>
    <radialGradient id="blackOval" cx="42%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="55%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="mCircle" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- outer metallic bevel ring -->
  <ellipse cx="210" cy="160" rx="205" ry="150" fill="url(#bevel)"/>

  <!-- teal band -->
  <ellipse cx="210" cy="160" rx="188" ry="138" fill="url(#teal)"/>

  <!-- inner black oval -->
  <ellipse cx="210" cy="160" rx="148" ry="95" fill="url(#blackOval)"/>

  <!-- straight "THE" (top) -->
  <text x="210" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="36" letter-spacing="5" fill="#0A0A0A">THE</text>

  <!-- straight "CAFE" (bottom) -->
  <text x="210" y="284" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="36" letter-spacing="7" fill="#0A0A0A">CAFE</text>

  <!-- side monogram circles, tucked against the black oval's edge -->
  <g>
    <circle cx="52" cy="160" r="25" fill="url(#mCircle)" stroke="#0a4c4a" stroke-width="2"/>
    <text x="52" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-style="italic" font-weight="700" font-size="24" fill="#3FC2BE">M</text>

    <circle cx="368" cy="160" r="25" fill="url(#mCircle)" stroke="#0a4c4a" stroke-width="2"/>
    <text x="368" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-style="italic" font-weight="700" font-size="24" fill="#3FC2BE">M</text>
  </g>

  <!-- script wordmark -->
  <text x="212" y="196" text-anchor="middle"
        font-family="Great Vibes, cursive"
        font-size="110" fill="#FBF6EE" transform="rotate(-5 212 190)">Mall</text>
</svg>
